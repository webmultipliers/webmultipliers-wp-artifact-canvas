name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  MAIN_FILE: webmultipliers-wp-artifact-canvas.php
  SLUG: webmultipliers-wp-artifact-canvas

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Composer install
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint (PHPCS)
        run: composer lint

      - name: Static analysis (PHPStan)
        run: composer analyse

      - name: Tests (PHPUnit)
        run: composer test

  release:
    name: Build and Release
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches plugin header version
        run: |
          VERSION=$(grep -i '^\s*\*\s*Version:' "${MAIN_FILE}" | awk -F': ' '{print $2}' | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::Version not found in ${MAIN_FILE} header."
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag (${GITHUB_REF_NAME}) does not match plugin header version (v${VERSION}). Update the header first."
            exit 1
          fi
          echo "Releasing version ${VERSION}"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Build ZIP
        run: bash bin/build-zip.sh "${SLUG}.zip"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          commit: ${{ github.sha }}
          artifacts: "${{ env.SLUG }}.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          generateReleaseNotes: true
